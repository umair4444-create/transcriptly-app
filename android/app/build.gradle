plugins {
    id 'com.android.application'
}

android {
    namespace 'app.transcriptly'
    compileSdk 34

    defaultConfig {
        applicationId 'app.transcriptly'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // signed automatically with the debug key - installable via sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
